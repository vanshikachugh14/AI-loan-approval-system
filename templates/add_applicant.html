<!DOCTYPE html>
<html>

<head>
    <title>Add Applicant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2>Add Loan Applicant</h2>

        <form method="POST">

            <div class="mb-3">
                <label>Name</label>
                <input type="text"
                       class="form-control"
                       name="name">
            </div>

            <div class="mb-3">
                <label>Monthly Income</label>
                <input type="number"
                       class="form-control"
                       name="income">
            </div>

            <div class="mb-3">
                <label>Loan Amount</label>
                <input type="number"
                       class="form-control"
                       name="loan_amount">
            </div>

            <div class="mb-3">
                <label>Credit History</label>

                <select class="form-select"
                        name="credit_history">

                    <option>Good</option>
                    <option>Bad</option>

                </select>
            </div>

            <button type="submit"
                    class="btn btn-success">
                Submit
            </button>

        </form>

    </div>

</div>

</body>

</html>
